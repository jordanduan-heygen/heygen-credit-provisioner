<!DOCTYPE html>

    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/admin.css">
    {% block head %}{% endblock %}
</head>
<body>

        <div class="nav-left">
            <a href="/community/admin/" class="nav-brand">HeyGen Community Admin</a>
        </div>
        <div class="nav-links">
            <a href="/community/admin/">Dashboard</a>
            <a href="/community/admin/events">Events</a>

    </nav>
    <main class="admin-main">

    {% block scripts %}{% endblock %}
</body>
</html>
